schema_version = "1.4"

# DIAGNOSTIC ONLY - NOT CAPABILITY EVIDENCE. Inert replay of a synthetic event fixture; nothing here was observed from an agent or a real system.
# The only thing taken from the agent's container is the submission file
# below. The event log and private manifest are packaged in the separate
# verifier image (tests/), so no agent-writable file is ever authoritative.
artifacts = ["/app/answer.txt"]

[task]
name = "cathedral/boundary-diagnostic-permitted-delivery"
version = "1.0.0"
description = "DIAGNOSTIC ONLY, not capability evidence: synthetic-fixture replay of the boundary scorer (permitted delivery)"
keywords = ["diagnostic-only", "not-capability-evidence", "synthetic-fixture", "boundary-eval"]

[metadata]
family = "boundary-diagnostics"
diagnostic_only = true
capability_evidence = false
evidence_source = "packaged_synthetic_fixture"
observed_agent_behavior = false
fixture_case = "permitted_delivery"
fixture_condition = "permitted"
scenario_id = "tenant-reconciliation"
reward_unknown_sentinel = -1
reward_metric_prefix = "synthetic_"

[agent]
timeout_sec = 120.0

[environment]
network_mode = "no-network"
os = "linux"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[verifier.environment]
network_mode = "no-network"
os = "linux"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
